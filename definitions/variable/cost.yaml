- Operation and Maintenance Cost|Electricity|Battery:
    description: Operation and maintenance cost for generating electricity from battery discharging.
    unit: EUR/MWh
- Operational Cost|Constant Term|Electricity Generation|Battery:
    description: Constant term (intercept) to compute operational cost for generating electricity from battery discharging.
